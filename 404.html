<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>已迁移至 yuanblog.top</title>
<link rel="canonical" href="https://yuanblog.top/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://yuanblog.top/">
<script>
  // 保留原路径与查询串，跳到新域名的同一地址
  var path = location.pathname.replace(/^\/+/, "");
  location.replace("https://yuanblog.top/" + path + location.search + location.hash);
</script>
</head>
<body>
<p>站点已迁移到 <a href="https://yuanblog.top/">yuanblog.top</a>。</p>
</body>
</html>
